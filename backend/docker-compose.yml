version: "3.8"

services:
  ai-paws:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/backend
    environment:
      - PYTHONPATH=/backend
    env_file:
      - .env
    depends_on:
      ai-paws-db:
        condition: service_healthy
    command: ["sh", "-c", "cd /backend/app && alembic upgrade head && cd /backend && uvicorn app.main:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips='*'"]

  ai-paws-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ai-paws
      POSTGRES_PASSWORD: pawsword123
      POSTGRES_DB: ai-paws
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai-paws -d ai-paws"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
